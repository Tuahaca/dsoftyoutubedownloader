<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamicsoft Youtube downloader</title>
  </head>

    <header class="bar">
      <span class="brand"><img src="/icons/icon-32.png" width="18" height="18" alt="" />Dynamicsoft Youtube downloader</span>
